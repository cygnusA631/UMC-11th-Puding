$kind: http-request
url: "{{baseUrl}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "other6_{{runTag}}@example.com",
      "password": "Umc!1234",
      "nickname": "다른{{runTag}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('otherMemberId', pm.response.json().result.memberId);
    language: text/javascript
order: 2000
