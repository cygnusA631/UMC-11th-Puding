url: "{{baseUrl}}/members/{{memberId}}/ratings/{{ratingId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "score": 4,
      "comment": "수정 완료"
    }
scripts:
