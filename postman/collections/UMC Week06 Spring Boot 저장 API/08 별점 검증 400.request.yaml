$kind: http-request
url: "{{baseUrl}}/members/{{memberId}}/ratings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "movieId": 155,
      "score": 6,
      "comment": "6주차 실습"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Failure envelope', () => { const b=pm.response.json(); pm.expect(b.isSuccess).to.eql(false); pm.expect(b.result).to.eql(null); });
    language: text/javascript
order: 8000
